<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Aplicativo de saúde e bem-estar com foco em flexibilidade"><title>Feedback | Seu ritmo</title><link rel="stylesheet" href="feedback.css"></head><body><header><strong>Seu ritmo</strong><nav aria-label="Navegação principal"><a href="sobre.html">Sobre nós</a><a href="faq.html">FAQ</a><a href="feedback.html">Feedback</a></nav></header><main><h1>Envie seu feedback</h1><p class="sub">Sua opinião pode ajudar a melhorar a experiência no aplicativo.</p><form action="#" method="get" onsubmit="return false"><label for="nota">Como você avalia a experiência?</label><select id="nota" name="nota" required><option value="">Selecione uma opção</option><option>Muito boa</option><option>Boa</option><option>Regular</option><option>Precisa melhorar</option></select><label for="assunto">Assunto</label><select id="assunto" name="assunto"><option>Usabilidade</option><option>Treinos</option><option>Refeições</option><option>Sugestão de recurso</option><option>Outro</option></select><label for="mensagem">Comentário ou sugestão</label><textarea id="mensagem" name="mensagem" required maxlength="1500" placeholder="Conte o que funcionou bem e o que pode melhorar..."></textarea><p class="hint">Protótipo visual: este formulário ainda não envia nem armazena respostas. Não inclua dados pessoais ou informações de saúde.</p><button type="button" disabled title="Envio disponível após integração">Enviar (em breve)</button></form></main><footer>Seu treino, sua dieta, seu ciclo, seu ritmo.</footer></body></html>
