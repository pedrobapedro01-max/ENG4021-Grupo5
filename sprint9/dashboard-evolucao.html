<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolução de treinos</title><style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:20px;background:#f5f7fa}main{background:white;padding:24px;border-radius:16px}input,button,select{padding:10px;margin:5px}canvas{width:100%;border:1px solid #ddd}</style><main><h1>Evolução de treinos</h1><p>Protótipo independente. Registros salvos apenas neste navegador.</p><form id="f"><input id="ex" placeholder="Exercício" required><input id="date" type="date" required><input id="load" type="number" min="0" step="0.5" placeholder="Carga (kg)" required><button>Adicionar</button></form><label>Exercício <select id="filter"></select></label><canvas id="chart" width="720" height="320" aria-label="Gráfico de evolução"></canvas><ul id="list"></ul></main><script>const k='s9_workouts',$=id=>document.getElementById(id);let data=JSON.parse(localStorage.getItem(k)||'[]');$('date').value=new Date().toISOString().slice(0,10);function render(){let names=[...new Set(data.map(x=>x.ex))],sel=$('filter').value;$('filter').replaceChildren(...names.map(n=>new Option(n,n)));if(names.includes(sel))$('filter').value=sel;let rows=data.filter(x=>x.ex===$('filter').value).sort((a,b)=>a.date.localeCompare(b.date));$('list').replaceChildren(...rows.map(r=>{let li=document.createElement('li');li.textContent=r.date+' — '+r.ex+': '+r.load+' kg';return li}));let ctx=$('chart').getContext('2d');ctx.clearRect(0,0,720,320);ctx.beginPath();ctx.moveTo(45,15);ctx.lineTo(45,280);ctx.lineTo(700,280);ctx.stroke();if(!rows.length)return;let max=Math.max(1,...rows.map(x=>x.load));ctx.strokeStyle='#2463a0';ctx.lineWidth=3;ctx.beginPath();rows.forEach((r,i)=>{let x=55+(rows.length===1?320:i*630/(rows.length-1)),y=275-r.load/max*240;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}$('f').onsubmit=e=>{e.preventDefault();data.push({ex:$('ex').value.trim(),date:$('date').value,load:Number($('load').value)});localStorage.setItem(k,JSON.stringify(data));render();$('ex').value='';$('load').value=''};$('filter').onchange=render;render()</script></html>
