<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planejador semanal de hábitos</title><style>:root{font:16px system-ui;color:#1b3a2e;background:#edf5ef}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:860px;margin:auto;background:white;padding:24px;border-radius:18px}h1{margin-top:0}.muted{color:#60766b}form{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #9cb8a7}input{flex:1;min-width:180px}button{background:#1a7650;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f0ad44}.week{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border-bottom:1px solid #e0eae3;padding:12px;text-align:center}th:first-child,td:first-child{text-align:left}td button{background:#e5f4e9;color:#214936;min-width:42px}td button.done{background:#217a50;color:white}.delete{background:#a13f3f}#summary{font-weight:600}@media(max-width:600px){body{padding:0}main{border-radius:0;padding:14px}th,td{padding:6px}td button{min-width:32px;padding:8px}}</style></head><body><main><h1>Planejador semanal de hábitos</h1><p class="muted">Protótipo independente para organizar hábitos de bem-estar, sem conexão com o site principal. Os dados ficam neste navegador.</p><form id="form"><input id="habit" maxlength="60" placeholder="Ex.: beber água, alongar, descansar" required aria-label="Nome do hábito"><button>Adicionar hábito</button></form><p id="summary" aria-live="polite"></p><div class="week"><table><thead><tr><th>Hábito</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sáb</th><th>Dom</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table></div><button id="reset" type="button">Reiniciar semana</button></main><script>const key='sprint9_habitos', $=id=>document.getElementById(id);let habits=[];try{const value=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(value))habits=value}catch{}function save(){localStorage.setItem(key,JSON.stringify(habits));render()}function render(){const rows=$('rows');rows.replaceChildren();let done=0;for(const h of habits){const tr=document.createElement('tr'),name=document.createElement('td');name.textContent=h.name;tr.append(name);for(let d=0;d<7;d++){const td=document.createElement('td'),b=document.createElement('button');b.type='button';const checked=Boolean(h.days[d]);if(checked)done++;b.className=checked?'done':'';b.textContent=checked?'✓':'○';b.setAttribute('aria-label',h.name+' dia '+(d+1)+(checked?' concluído':' pendente'));b.setAttribute('aria-pressed',String(checked));b.onclick=()=>{h.days[d]=!h.days[d];save()};td.append(b);tr.append(td)}const action=document.createElement('td'),remove=document.createElement('button');remove.className='delete';remove.textContent='Excluir';remove.setAttribute('aria-label','Excluir '+h.name);remove.onclick=()=>{habits=habits.filter(x=>x.id!==h.id);save()};action.append(remove);tr.append(action);rows.append(tr)}$('summary').textContent=habits.length?done+' de '+(habits.length*7)+' marcações concluídas nesta semana.':'Adicione seu primeiro hábito.'}$('form').onsubmit=e=>{e.preventDefault();const name=$('habit').value.trim();if(!name)return;habits.push({id:Date.now()+Math.random(),name,days:Array(7).fill(false)});$('habit').value='';save()};$('reset').onclick=()=>{if(confirm('Reiniciar todas as marcações da semana?')){habits.forEach(h=>h.days=Array(7).fill(false));save()}};render()</script></body></html>
