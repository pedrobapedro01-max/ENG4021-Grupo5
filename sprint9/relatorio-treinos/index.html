<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatório de treinos • Protótipo independente</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#edf3f0;color:#193a2c}main{max-width:850px;margin:30px auto;padding:26px;background:white;border-radius:16px}h1{margin-top:0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}input,button{padding:11px;border:1px solid #a9bfb3;border-radius:8px;font:inherit}button{background:#176a48;color:white;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f4ae4a}table{width:100%;border-collapse:collapse;margin-top:20px}th,td{text-align:left;padding:12px;border-bottom:1px solid #dbe8e0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.muted{color:#607a6c}@media print{body{background:white}main{margin:0;padding:0}.no-print{display:none}button{display:none}}@media(max-width:480px){main{margin:0;border-radius:0;padding:16px}table{font-size:13px}th,td{padding:6px}}</style></head>
<body><main><h1>Relatório de treinos</h1><p class="muted">Ferramenta independente: os registros ficam somente neste navegador. Use Imprimir / Salvar em PDF para exportar.</p>
<div class="no-print"><form id="form"><label>Data<input type="date" id="date" required></label><label>Exercício<input id="exercise" maxlength="80" required placeholder="Ex.: agachamento"></label><label>Séries<input id="sets" type="number" min="1" max="100" required></label><label>Repetições<input id="reps" type="number" min="1" max="1000" required></label><button>Adicionar treino</button></form><div class="actions"><button type="button" id="print">Imprimir / Salvar em PDF</button><button type="button" id="clear">Limpar registros</button></div></div>
<h2>Resumo</h2><p id="summary" aria-live="polite">Nenhum treino registrado.</p>
<table><thead><tr><th>Data</th><th>Exercício</th><th>Séries</th><th>Repetições</th><th class="no-print">Ação</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
const $=id=>document.getElementById(id),key="sprint9_relatorio_treinos";
let entries;try{entries=JSON.parse(localStorage.getItem(key)||"[]");if(!Array.isArray(entries))entries=[]}catch{entries=[]}
$("date").value=new Date().toLocaleDateString("en-CA");
function persist(){localStorage.setItem(key,JSON.stringify(entries));render()}
function render(){const body=$("rows");body.replaceChildren();const ordered=[...entries].sort((a,b)=>a.date.localeCompare(b.date));for(const entry of ordered){const tr=document.createElement("tr");for(const val of [entry.date,entry.exercise,entry.sets,entry.reps]){const td=document.createElement("td");td.textContent=val;tr.append(td)}const td=document.createElement("td");td.className="no-print";const remove=document.createElement("button");remove.type="button";remove.textContent="Excluir";remove.setAttribute("aria-label","Excluir "+entry.exercise+" em "+entry.date);remove.onclick=()=>{entries=entries.filter(e=>e.id!==entry.id);persist()};td.append(remove);tr.append(td);body.append(tr)}const total=entries.reduce((s,e)=>s+e.sets,0);$("summary").textContent=entries.length?entries.length+" registro(s), "+total+" série(s) no total.":"Nenhum treino registrado."}
$("form").addEventListener("submit",e=>{e.preventDefault();entries.push({id:crypto.randomUUID(),date:$("date").value,exercise:$("exercise").value.trim(),sets:Number($("sets").value),reps:Number($("reps").value)});persist();$("exercise").value="";$("sets").value="";$("reps").value=""});
$("clear").onclick=()=>{if(confirm("Excluir todos os registros deste navegador?")){entries=[];persist()}};
$("print").onclick=()=>window.print();render();
</script></body></html>
