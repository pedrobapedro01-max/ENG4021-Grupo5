<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendário de treinos</title><style>body{font:16px system-ui;background:#f5f7fa;max-width:850px;margin:40px auto;padding:20px}main{background:white;padding:24px;border-radius:16px}input,button{padding:10px;margin:5px}li{padding:12px;border-bottom:1px solid #ddd}</style><main><h1>Calendário de treinos</h1><p>Agende, reagende e conclua treinos. Dados locais deste navegador.</p><form id="form"><input id="name" required placeholder="Nome do treino"><input id="day" type="date" required><button>Agendar</button></form><label>Ver mês <input id="month" type="month"></label><ul id="list"></ul></main><script>const key='s9_schedule',$=id=>document.getElementById(id);let items=JSON.parse(localStorage.getItem(key)||'[]');$('day').value=new Date().toISOString().slice(0,10);$('month').value=$('day').value.slice(0,7);function save(){localStorage.setItem(key,JSON.stringify(items));render()}function render(){let list=$('list');list.replaceChildren();let selected=items.filter(x=>x.day.startsWith($('month').value)).sort((a,b)=>a.day.localeCompare(b.day));if(!selected.length){let li=document.createElement('li');li.textContent='Nenhum treino neste mês.';list.append(li)}for(let item of selected){let li=document.createElement('li'),label=document.createElement('span');label.textContent=item.day+' — '+item.name+(item.done?' (concluído)':'');li.append(label);let date=document.createElement('input');date.type='date';date.value=item.day;date.setAttribute('aria-label','Reagendar '+item.name);date.onchange=()=>{item.day=date.value;save()};li.append(date);let done=document.createElement('button');done.textContent=item.done?'Desmarcar':'Concluir';done.onclick=()=>{item.done=!item.done;save()};li.append(done);let del=document.createElement('button');del.textContent='Excluir';del.onclick=()=>{items=items.filter(x=>x.id!==item.id);save()};li.append(del);list.append(li)}}$('form').onsubmit=e=>{e.preventDefault();items.push({id:Date.now()+Math.random(),name:$('name').value.trim(),day:$('day').value,done:false});$('month').value=$('day').value.slice(0,7);save();$('name').value=''};$('month').onchange=render;render()</script></html>
